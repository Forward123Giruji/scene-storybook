name: Rename flipbook to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename flipbook.html to index.html
        run: |
          if [ -f flipbook.html ] && [ ! -f index.html ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git mv flipbook.html index.html
            git commit -m "Rename flipbook.html to index.html"
            git push
          else
            echo "Nothing to rename"
          fi
